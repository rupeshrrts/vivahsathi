name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run check
      # boots the server on a fresh sample database and checks it answers
      - run: |
          node backend/server.js &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000/healthz > /dev/null
          curl -fsS http://localhost:3000/api/meta > /dev/null
          curl -fsS http://localhost:3000/ > /dev/null
      - run: docker build -t vivah-saathi-ci .
      - run: |
          docker run -d --name vivah-saathi-ci -p 3001:3000 vivah-saathi-ci
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3001/readyz
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx expo export --platform android
